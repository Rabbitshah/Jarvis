[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first personal AI assistant: Ollama + tools, later MCP, Qdrant memory and voice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp[cli]>=2,<3",
  "qdrant-client>=1.20,<2",
  "numpy>=1.26",
  "sounddevice>=0.5",
  # speech to text: chosen by measurement on Day 24 (docs/STT.md)
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8"]
# both engines, only for scripts/stt-bench.sh (re-measure)
bench = ["faster-whisper>=1.1", "mlx-whisper>=0.4"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-api = "jarvis.api:main"
jarvis-mcp = "jarvis.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tools/pytest_cache"
