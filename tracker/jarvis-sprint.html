<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--card:#f6f6f4;--acc:#2a5bd7;--ok:#1e7a46}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--card:#202020;--acc:#7aa2ff;--ok:#5fcf8e}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:900px;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
h1{margin:0 0 4px}h2{margin:28px 0 8px;font-size:18px}
.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}
tr.now{background:var(--card);outline:2px solid var(--acc)}
ul{padding-left:20px}
form{display:grid;gap:8px;background:var(--card);padding:12px;border-radius:8px}
label{font-size:13px;color:var(--mut)}
input,textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:var(--bg);font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.entry{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.entry b{color:var(--acc)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stat{background:var(--card);padding:8px 12px;border-radius:8px}
pre{white-space:pre-wrap;background:var(--card);padding:12px;border-radius:8px}
</style>
</head>

<h2>Rules</h2>

<h2>Today</h2>

<h2>Progress</h2>
<div class="bar" id="stats"></div>

<h2>Add daily log</h2>
<form id="f">
  <div class="row">
    <div><label>Date</label><input type="date" name="date" required></div>
    <div><label>Hours</label><input type="number" name="hours" step="0.25" min="0" value="1"></div>
  </div>
  <div><label>Week</label><select name="week"></select></div>
  <div><label>What I did</label><textarea name="did" rows="2" required></textarea></div>

  <div><label>What broke</label><input name="broke"></div>
  <div><label>Next session: ___</label><input name="next" required></div>

const KEY="jarvis-sprint-log-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const weekOf=d=>(PLAN.find(p=>d>=p.from&&d<=p.to)||{}).w||"";
let log=[];
try{log=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){log=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}};

$("#goal").textContent=GOAL;
$("#rules").innerHTML=RULES.map(r=>`<li>${esc(r)}</li>`).join("");
$("#plan").innerHTML="<tr><th>Week</th><th>Dates</th><th>Focus</th><th>Done when</th><th>Days logged</th></tr>"+
  PLAN.map(p=>{
    const n=allEntries().filter(e=>e.week==p.w).length;
    return `<tr class="${weekOf(today())==p.w?"now":""}"><td>${p.w}</td><td>${p.from.slice(5)} – ${p.to.slice(5)}</td><td>${esc(p.focus)}</td><td>${esc(p.done)}</td><td>${n}</td></tr>`;
  }).join("");
$("select[name=week]").innerHTML=PLAN.map(p=>`<option value="${p.w}">Week ${p.w}</option>`).join("");
$("input[name=date]").value=today();
$("select[name=week]").value=weekOf(today())||1;
$("input[name=date]").onchange=e=>{const w=weekOf(e.target.value);if(w)$("select[name=week]").value=w};

function allEntries(){
  return [...LOG.map(e=>({...e,week:e.week||weekOf(e.date),repo:true})), ...log.map((e,i)=>({...e,i}))];
}
function render(){
  const all=allEntries().sort((a,b)=>b.date.localeCompare(a.date));
  const hrs=all.reduce((s,e)=>s+(+e.hours||0),0);
  $("#stats").innerHTML=`<div class="stat">Entries: <b>${all.length}</b></div><div class="stat">Hours: <b>${hrs}</b></div>`;
  $("#log").innerHTML=all.length?all.map(e=>`<div class="entry"><b>${esc(e.date)}</b> · Week ${esc(e.week)} · ${esc(e.hours)}h${e.repo?" · saved in repo":""}
    <div>${esc(e.did)}</div>
    ${e.check?`<div class="mut">Check: ${esc(e.check)}</div>`:""}
    ${e.broke?`<div class="mut">Broke: ${esc(e.broke)}</div>`:""}
    <div>Next session: ${esc(e.next)}</div>
    ${e.repo?"":`<button class="alt" data-i="${e.i}">Delete</button>`}</div>`).join(""):'<p class="mut">No entries yet.</p>';
}
$("#log").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined&&confirm("Delete this entry?")){log.splice(+i,1);save();render()}};
$("#f").onsubmit=e=>{e.preventDefault();log.push(Object.fromEntries(new FormData(e.target)));save();e.target.reset();
  $("input[name=date]").value=today();$("input[name=hours]").value=1;$("select[name=week]").value=weekOf(today())||1;render();location.reload()};
$("#sum").onclick=()=>{
  const w=+$("select[name=week]").value, es=allEntries().filter(e=>e.week==w), p=PLAN.find(x=>x.w==w);
  $("#out").hidden=false;
  $("#out").textContent=[
    `Jarvis Week ${w} summary`,
    `Shipped: ${es.map(e=>e.did).join("; ")||"nothing logged"}`,
    `Repo link: <add>`,
    `Broke: ${es.map(e=>e.broke).filter(Boolean).join("; ")||"nothing logged"}`,
    `Hours: ${es.reduce((s,e)=>s+(+e.hours||0),0)} | Left: target was "${p.done}" | Next: ${(es[0]||{}).next||"?"}`
  ].join("\n");
};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(log,null,2)],{type:"application/json"}));a.download="jarvis-log.json";a.click()};
$("#imp").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".json";
  i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(Array.isArray(d)){log=d;save();render();location.reload()}}catch(e){alert("Bad file")}};i.click()};
(function(){
  const t=today(), d=DAYS.find(x=>x.date===t)||DAYS.find(x=>x.date>t);
  const el=document.getElementById('today');
  if(!d){el.textContent='No task scheduled.';return}
  const isToday=d.date===t;
  el.innerHTML=`<b>${isToday?'Today':'Next'}: Day ${d.n} (${esc(d.date)})</b><div>${esc(d.task)}</div><div class="mut">Done when: ${esc(d.done)}</div>`;
})();
render();
</script>
</body>
