# All runtime settings live here. Env overrides: JARVIS_MODEL, JARVIS_OLLAMA_URL, JARVIS_NOTES_DIR.

[llm]
# Private Ollama server started from this repo (port differs from the default 11434
# so it never clashes with a system-wide Ollama).
ollama_url = "http://127.0.0.1:11500"
model = "llama3.1:8b"            # chat model. Verify with: scripts/doctor.sh
embed_model = "nomic-embed-text" # used from week 3 (Qdrant memory)
timeout_seconds = 120

[agent]
max_tool_rounds = 4
max_history = 40
tool_timeout_seconds = 10   # a stuck tool returns an error after this long
system_prompt = """You are Jarvis, a concise personal assistant running fully on the user's own machine.
Use tools when they help. For questions about the user's own life, work, projects or plans, call search_notes and answer from the excerpts. For general knowledge (facts, explanations, ideas, advice, jokes) answer from your own knowledge and do not search the notes. Do not write sources yourself; the program adds them. When the user asks you to remember something, call the remember tool: it saves nothing itself, it only asks the user to approve. Use it only on an explicit request, and never say the fact is saved. If you do not know a note's exact file name, call list_notes first, then read_note. Never invent file contents: read the note first.
You cannot see a calendar, email, the weather, news or the internet. If asked for something none of your tools can give, say so plainly in one sentence. Never guess facts about the user or invent events.
Trust tool results and answer directly from them; do not ask the user for information a tool already gave.
Answer in plain sentences. Never describe your own steps, the tools you used, or what you are about to do.
If a tool returns an error, tell the user plainly. Keep answers short."""

[paths]
notes_dir = "notes"   # relative to the repo root
ingest_exclude = ["README.md", "sample-*"]   # files that are not real notes
# Notes the model can NEVER see: not listed, not readable, not searched, not indexed. Patterns match the
# path inside notes/, lower-case. Put sensitive notes in notes/private/ or add your own patterns.
private_notes = ["private/*", "*password*", "*salary*"]
index_dir = ".tools/qdrant"   # note index; rebuildable from notes, safe to delete

[memory]
enabled = true        # put matching note excerpts into each question
k = 3                 # how many excerpts at most
min_score = 0.51      # ignore weaker matches (real scores Oct 25: right note >= 0.521, off-topic <= 0.494)
# The next four change how notes are embedded. After changing any of them, run scripts/ingest.sh again.
chunk_chars = 400     # max characters per chunk (400 beat 800 and 1200 in scripts/tune.sh, see docs/TUNING.md)
note_header = true    # put "Note: <file name>" in front of each chunk before embedding
doc_prefix = ""       # task prefix for notes, e.g. "search_document: " (nomic-embed-text)
query_prefix = ""     # task prefix for questions, e.g. "search_query: "

[voice]
# Day 24 measurement (docs/STT.md): small model, 0 wrong words on 3 clips; mlx 0.07 s vs faster-whisper 0.87 s per clip.
# mlx runs only on Apple Silicon. On other machines use "faster:small" (or env JARVIS_STT).
stt = "mlx:mlx-community/whisper-small-mlx"
# Piper speaks the replies. It runs as its own local server (scripts/piper-up.sh), kept apart from this code on purpose:
# Piper is GPL-3.0, Jarvis is MIT.
tts_url = "http://127.0.0.1:5500"
tts_voice = "en_US-lessac-medium"
tts_length_scale = 0.82   # speaking speed: 1.0 normal, lower = faster (0.82 is about 20% faster)

[api]
host = "127.0.0.1"    # local only. Do not change without adding auth.
port = 8000
