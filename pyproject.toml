[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first personal AI assistant: Ollama + tools, later MCP, Qdrant memory and voice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "mcp[cli]>=2,<3",
  "qdrant-client>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-api = "jarvis.api:main"
jarvis-mcp = "jarvis.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tools/pytest_cache"
